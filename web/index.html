<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>aiweather: live status of every AI</title>
<meta name="description" content="The live status of every major AI company, read from their official status pages and drawn as one weather sky.">
<meta name="theme-color" content="#050A1E">
<meta property="og:title" content="aiweather">
<meta property="og:description" content="The live status of every major AI company, drawn as one weather sky.">
<meta property="og:url" content="https://aiweather.synteq.app/">
<meta property="og:image" content="https://aiweather.synteq.app/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="675">
<meta property="og:image:alt" content="aiweather: the cloud logo on a pale, cloudy sky">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="aiweather">
<meta name="twitter:description" content="The live status of every major AI company, drawn as one weather sky.">
<meta name="twitter:image" content="https://aiweather.synteq.app/og.jpg">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preload" href="/fonts/manrope-700-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/manrope-600-normal.woff2" as="font" type="font/woff2" crossorigin>
<script>
/* Big screens: everything scales up together (1 up to about a 1500×940 window, then grows with the smaller side). Runs before
   the first paint so nothing jumps. */
(function () {
  var r = document.documentElement;
  function k() { r.style.setProperty('--k', Math.max(1, Math.min(innerWidth / 1500, innerHeight / 940, 2.2)).toFixed(3)); }
  k(); addEventListener('resize', k);
})();
</script>
<script>
/* The sky and the board start loading now, alongside the scripts instead of after them (this sits above the stylesheet,
   which would hold it back): the board's data, and the first-frame still of the sky the board most often shows (a clear
   sky for the viewer's time of day, as weather.js picks). */
(function () {
  window.__snapshot = fetch('/api/snapshot', { cache: 'no-store' }).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; });
  var d = new Date(), h = d.getHours() + d.getMinutes() / 60, l = document.createElement('link');
  l.rel = 'preload'; l.as = 'image'; l.href = h < 5.5 || h >= 20.5 ? '/video/clear-night.jpg' : '/video/clear-day.jpg';
  document.head.appendChild(l);
})();
</script>
<link rel="stylesheet" href="/src/style.css">
</head>
<body data-weather="clear" data-view="grid">
<canvas id="sky" aria-hidden="true"></canvas>
<div class="veil" aria-hidden="true"></div>
<div class="edge" aria-hidden="true"></div>
<div class="edge-foot" aria-hidden="true"></div>

<header class="top">
  <a class="brand" href="/" data-home aria-label="aiweather home"><span class="mark" data-mark></span><span class="word">aiweather</span></a>
  <nav class="controls" id="controls" aria-label="Display">
    <div class="mrow view-row"><span class="mlabel">Layout</span>
      <div class="opt" data-pref="view" role="radiogroup" aria-label="Layout">
        <i class="rule" aria-hidden="true"></i>
        <button type="button" role="radio" data-value="grid">Grid</button>
        <button type="button" role="radio" data-value="list">List</button>
        <button type="button" role="radio" data-value="calm">Calm</button>
      </div>
    </div>
    <i class="mdiv" aria-hidden="true"></i>
    <button type="button" class="mrow mlink" id="edit-list"><span class="mtext"><b>Edit list</b><small>Or hold any company to move it</small></span></button>
  </nav>
  <div class="top-right">
    <div class="live" title="Official status pages, checked every minute"><span class="beat" aria-hidden="true"></span><span id="updated">connecting</span></div>
    <button type="button" class="link" id="arrange-add">Add</button>
    <button type="button" class="link menu-toggle" id="menu-toggle" aria-controls="controls" aria-expanded="false">Menu</button>
  </div>
</header>

<main id="home" class="home">
  <section class="forecast" aria-live="polite">
    <h1 id="headline" class="headline">Reading the sky</h1>
    <p id="subline" class="subline"></p>
    <p id="footnote" class="footnote"></p>
    <div id="affected" class="affected"></div>
    <section class="feed" aria-label="Latest changes">
      <h2 class="feed-title">Latest changes</h2>
      <ol id="feed" class="feed-list"></ol>
    </section>
  </section>
  <section id="stations" class="stations" aria-label="Every AI service"></section>
</main>

<section id="pages" class="pages" hidden aria-label="Company details">
  <div id="track" class="track"></div>
  <button type="button" class="pill pg-back" id="pg-back" aria-label="Back to all companies"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg><span>Back</span></button>
  <button type="button" class="side prev" id="pg-prev" aria-label="Previous company"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
  <button type="button" class="side next" id="pg-next" aria-label="Next company"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
  <nav class="pg-bar">
    <button type="button" class="pill round" id="pg-home" aria-label="All companies"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="1.6"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.6"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.6"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.6"/></svg></button>
    <div class="dots pill" id="dots"></div>
    <button type="button" class="pill round" id="pg-list" aria-label="Edit your list"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6.5h11M9 12h11M9 17.5h11"/><circle cx="4.6" cy="6.5" r="1.3"/><circle cx="4.6" cy="12" r="1.3"/><circle cx="4.6" cy="17.5" r="1.3"/></svg></button>
  </nav>
</section>

<div id="editor" class="editor" hidden role="dialog" aria-modal="true" aria-labelledby="editor-title">
  <div class="editor-sheet">
    <header class="editor-head">
      <h2 id="editor-title">Your list</h2>
      <button type="button" class="link strong" id="editor-done">Done</button>
    </header>
    <p class="editor-hint">Drag the handle to put the ones that matter most first. Tap the switch to show or hide a company. Saved in this browser.</p>
    <h3 class="editor-sec">Showing <span id="ed-count-on"></span></h3>
    <ol id="ed-on" class="ed-list"></ol>
    <div id="ed-off-wrap">
      <h3 class="editor-sec">Hidden <span id="ed-count-off"></span></h3>
      <ol id="ed-off" class="ed-list"></ol>
    </div>
    <button type="button" class="link" id="editor-reset">Reset to the default list</button>
  </div>
</div>

<div id="tip" class="tip" role="tooltip" hidden></div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
